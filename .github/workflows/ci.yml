name: CI

# Проверки выполняются при каждом пуше в основную ветвь и при каждом запросе
# на слияние. Назначение: не допустить попадания в основную ветвь состояния,
# не проверенного локально. Локально те же проверки выполняет scripts/check.ps1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Предыдущий запуск прерывается при поступлении нового: серия последовательных
# коммитов иначе расходует время вычислительных ресурсов впустую.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis-and-tests:
    name: Проверки качества
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Подготовка среды Python
        uses: actions/setup-python@v5
        with:
          # Нижняя граница, объявленная в pyproject. Проверяется именно она:
          # проект не должен работать при более старой версии. Более новые
          # версии намеренно не проверяются: отказ сборки вследствие обновления
          # стороннего пакета не относится к этому проекту.
          python-version: "3.12"

      - name: Установка зависимостей
        # Набор all, а не dev: тесты программного интерфейса и терминального
        # экрана импортируют fastapi и textual.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Проверка стиля и очевидных ошибок (ruff)
        run: ruff check .

      - name: Проверка типов (mypy, строгий режим)
        run: mypy

      # Тесты не обращаются к сети: используются фикстуры из репозитория.
      # Правило не декларативно: модуль conftest запрещает внешние соединения,
      # и тест, нарушивший его, завершается с ошибкой.
      - name: Запуск тестов (pytest)
        run: pytest

  repository-integrity:
    name: Целостность репозитория
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Проверка отсутствия приватных документов в индексе
        # Внутренние документы проекта не подлежат публикации. Обнаружение их
        # в индексе должно происходить здесь, а не спустя время.
        run: |
          leaked=$(git ls-files | grep -E '(^|/)(AGENT|prompt|DEVLOG|STATUS|TODO|BACKLOG|ROADMAP|DECISIONS|ARCHITECTURE|QUALITY|GLOSSARY)\.md$' || true)
          if [ -n "$leaked" ]; then
            echo "Обнаружены приватные документы:"
            echo "$leaked"
            exit 1
          fi

      - name: Проверка наличия обязательных публичных файлов
        run: |
          for f in README.md CHANGELOG.md LICENSE pyproject.toml .gitignore; do
            test -f "$f" || { echo "Отсутствует обязательный файл: $f"; exit 1; }
          done

      - name: Проверка отсутствия незаполненных плейсхолдеров
        run: |
          if grep -nE '\{\{[A-Z_]+\}\}' README.md CHANGELOG.md; then
            echo "В публичных файлах остались незаполненные плейсхолдеры"
            exit 1
          fi

      - name: Проверка установки пакета и запуска команды
        run: |
          python -m pip install --upgrade pip
          pip install .
          autoru --help > /dev/null
          autoru count || echo "Счётчик: база данных отсутствует, это штатный исход"